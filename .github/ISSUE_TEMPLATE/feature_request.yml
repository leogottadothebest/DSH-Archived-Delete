name: 功能建议
description: 提出新功能或改进想法
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        建议先搜索现有 issue 与 [DESIGN.md](https://github.com/leogottadothebest/DSH-Archived-Delete/blob/main/DESIGN.md)，确认该想法尚未被讨论或与现有设计冲突。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前体验的痛点。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望插件如何做（交互、入口、边界）。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案（可选）
      description: 其他可能的实现思路。
  - type: textarea
    id: context
    attributes:
      label: 补充信息（可选）
      description: 相关链接、截图等。
